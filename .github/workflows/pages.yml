# Publishes the app to GitHub Pages (free) on every push to master.
# On Pages there is no Python server, so the app saves data in the browser (localStorage) of each device.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        run: |
          mkdir -p _site/static
          cp -r static/style.css static/app.js static/icons _site/static/
          cp static/manifest.webmanifest static/sw.js _site/
          # switch the app to browser storage before app.js loads
          sed 's|<script src="static/app.js"></script>|<script>window.MINH_STATIC = 1</script>\n<script src="static/app.js"></script>|' static/index.html > _site/index.html
          grep -q MINH_STATIC _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
