<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6fbff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MINH//OS">
<title>Đăng nhập · MINH//OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#06283a;font:400 17px/1.5 Newsreader,Georgia,serif;
    background:radial-gradient(700px 500px at 15% 10%,rgba(0,210,255,.28),transparent 60%),radial-gradient(600px 500px at 90% 90%,rgba(61,255,176,.25),transparent 60%),
    linear-gradient(rgba(0,180,216,.12) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(0,180,216,.12) 1px,transparent 1px) 0 0/40px 40px,#e6fbff}
  form{width:100%;max-width:360px;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);border:1px solid #a9dde9;border-radius:12px;padding:28px 24px;
    box-shadow:0 10px 40px rgba(0,120,160,.15);text-align:center}
  img{width:72px;height:72px;border-radius:18px;box-shadow:0 6px 20px rgba(0,120,200,.3)}
  h1{font:700 28px Fraunces,Georgia,serif;letter-spacing:-.01em;margin:14px 0 4px}
  h1 span{color:#00b4d8}
  p{margin:0 0 18px;color:#3f6b80;font-size:14px}
  input{width:100%;font:inherit;padding:11px 14px;border:1px solid #a9dde9;border-radius:8px;background:#f6feff;color:inherit}
  input:focus{outline:none;border-color:#00b4d8;box-shadow:0 0 0 3px rgba(0,180,216,.25)}
  button{width:100%;margin-top:12px;font:500 13px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;padding:11px;border:0;border-radius:8px;
    background:#00b4d8;color:#00121a;cursor:pointer;transition:transform .15s,box-shadow .2s}
  button:hover{box-shadow:0 6px 18px rgba(0,180,216,.4);transform:translateY(-1px)}
  .err{color:#c0185f;margin:12px 0 0;font-size:14px}
</style>
</head>
<body>
<form method="post" action="/login">
  <img src="/static/icons/icon-192.png" alt="">
  <h1>MINH<span>//</span>OS</h1>
  <p>Chào Minh, nhập mật khẩu để vào nhé.</p>
  <input type="password" name="password" placeholder="Mật khẩu" autocomplete="current-password" required autofocus aria-label="Mật khẩu">
  <button>Đăng nhập</button>
  <!--ERR-->
</form>
</body>
</html>
